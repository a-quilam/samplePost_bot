"bricks.archive_confirm.peremestit_kirpichik_arhiv_html": "📦 <b>Переместить кирпичик в архив?</b>\n\nНазвание: {title}\nОбозначение: <code>[{code}]</code>\n\nКирпичик исчезнет из активного списка, но останется в архиве. Его можно восстановить в любой момент. Код останется занятым, чтобы ссылки на этот кирпичик продолжали работать правильно."
"bricks.build.1_nazvat_kirpichik_naprimer_html": "1️⃣ <b>Как назвать кирпичик?</b>\n\nНапример, «Ведущий мероприятия», «Формат участия» или «Стоимость билета».\n\nЭто название увидит автор анонса в списке и на экране вопроса. Код и описание добавим на следующих шагах."
"bricks.build.3_opisanie_avtora_anonsa_html": "3️⃣ <b>Подсказка для автора анонса</b>\n\n{shown}Напишите, что нужно указать в этом поле. Например, «Имя и фамилия ведущего, без должности» или «Цена в рублях, только число».\n\nПодсказка будет видна при заполнении поля. В текст анонса она не попадёт и шаблон не изменит.\n\nПодсказку можно не добавлять."
"bricks.build.izmenit_kirpichik_nazvanie_html": "✏️ <b>Изменить кирпичик</b>\n\nНазвание: {h}\nОбозначение: <code>[{h_2}]</code>\nТип: {type_title}\nОписание: {get}\nНастройки: {settings_text}\n\nТип изменить нельзя. Если нужен другой, создайте новый кирпичик. При редактировании этот кирпичик сохранит свой ID."
"bricks.build.oboznachenie_tip_opisanie_oblast_html": "🧱 <b>{title}</b>\n\nОбозначение: <code>[{code}]</code>\nТип: {type_title}\nОписание: {description}\nДоступ: только вам\nСтатус: {state_label}\nНастройки: {settings_text}\n\nЗдесь вы настраиваете поле. Значение для него вводится при создании анонса по шаблону. Сам по себе кирпичик в анонсы не добавляется."
"bricks.build.proverte_kirpichik_nazvanie_html": "👁 <b>Проверьте кирпичик</b>\n\nНазвание: {title}\nОбозначение: <code>[{code}]</code>\nТип: {type_title}\nОписание: {get}\nДоступ: только вам\nНастройки: {settings_text}\n\nПосле сохранения кирпичик появится в вашем списке. В анонсы и шаблоны он пока не добавляется."
"bricks.build.proverte_predlozhenie": "Проверьте предложение"
