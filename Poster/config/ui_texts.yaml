"bricks.code_input.2_tehnicheskoe_oboznachenie_html": "2️⃣ <b>Техническое обозначение</b>\n\n{intro}\n\n{current}Это короткая вставка <code>[код]</code>, которую автор шаблона пишет в тексте анонса вместо самого значения. От 2 до 64 символов: буквы, цифры, «_» и «-». Без пробелов и квадратных скобок.\n\nЕсли код уже занят, бот объяснит конфликт и попросит другой."
