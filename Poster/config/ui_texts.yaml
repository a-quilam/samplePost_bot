"menu.manage": "⚙️ Управление\n\nЗдесь можно работать с площадками, шаблонами и кирпичиками. Раздел «🛡 Администрирование» доступен тем, кому владелец Poster выдал права."
"menu.outside.photo": "Фото можно добавить при создании анонса, на шаге «Фотографии». Чтобы начать, нажмите «📍 Создать для площадки» или «📝 Создать по личному шаблону»."
"menu.outside.text": "Выберите действие в меню. Список команд — /help."
"menu.cancel.place": "Выбор места отменён."
"menu.cancel.admin": "Действие в разделе администрирования отменено."
"menu.cancel.brick": "Работа с кирпичиком отменена. Изменения не сохранены."
