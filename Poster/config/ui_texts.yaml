"bricks.handle_brick.vvedite_drugoe_oboznachenie": " Введите другое обозначение."
"bricks.proposal_list.zdes_hranitsya_istoriya_vashih": "\n\nЗдесь хранится история ваших предложений. Ожидающие предложения не имеют срока действия: их можно отозвать в любой момент, пока администратор не принял решение."
"bricks.proposal_scope.kirpichik_oboznachenie_vyberite_html": "\n\nКирпичик: <b>{title}</b>\nОбозначение: <code>[{code}]</code>\n\nВыберите область:\n• конкретное место — рассматривает действующий администратор этого места или суперадминистратор;\n• вся система — рассматривает только суперадминистратор.\n\nНовое место автоматически не создаётся."
"bricks.proposal_select_brick.vyberite_svoy_lichnyy_kirpichik": "\n\nВыберите свой личный кирпичик, который хотите предложить для места или всей системы.\n\nБудет отправлен снимок текущих названия, кода, типа и описания. Исходный личный кирпичик и его владелец не изменятся.\n\n"
"bricks.proposal_select_place.kirpichik_vyberite_mesto_html": "\n\nКирпичик: <b>{title}</b> <code>[{code}]</code>\n\nВыберите место из существующего справочника. Новое место здесь не создаётся."
"bricks.proposal_withdraw_confirm.nazvanie_oboznachenie_ce_html": "\n\nНазвание: {title}\nОбозначение: <code>[{code}]</code>\nЦель: {proposal_target_text}\n\nПосле отзыва администратор больше не сможет его одобрить. Личный кирпичик останется у вас без изменений. Новое предложение можно будет отправить позже."

