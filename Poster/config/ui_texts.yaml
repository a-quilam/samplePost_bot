"bricks.archive_confirm.peremestit_kirpichik_arhiv_html": "📦 <b>Переместить кирпичик в архив?</b>\n\nНазвание: {title}\nОбозначение: <code>[{code}]</code>\n\nОн исчезнет из активного списка, но останется у вас в архиве. Восстановить его можно в любой момент. Технический код останется занятым, чтобы старые и будущие ссылки не стали неоднозначными."
"bricks.build.1_nazvat_kirpichik_naprimer_html": "1️⃣ <b>Как назвать кирпичик?</b>\n\nНапример: «Ведущий мероприятия», «Формат участия» или «Стоимость билета».\n\nНазвание видно в списках и на экране вопроса — это то, что прочитает человек, заполняющий анонс. Техническое обозначение и описание зададим следующими шагами."
"bricks.build.3_opisanie_avtora_anonsa_html": "3️⃣ <b>Описание для автора анонса</b>\n\n{shown}Напишите подсказку тому, кто будет заполнять это поле: что именно указать и в каком виде. Например: «Имя и фамилия ведущего, без должности» или «Цена в рублях, только число».\n\nОписание видно на экране вопроса — над полем ввода. В текст анонса оно не попадает и на шаблон не влияет.\n\nПоле необязательное: без описания кирпичик работает как обычно."
"bricks.build.izmenit_kirpichik_nazvanie_html": "✏️ <b>Изменить кирпичик</b>\n\nНазвание: {h}\nОбозначение: <code>[{h_2}]</code>\nТип: {type_title}\nОписание: {get}\nНастройки: {settings_text}\n\nТип после создания не меняется: для другого типа создайте новый кирпичик. Идентификатор сохраняется при любых изменениях."
"bricks.build.oboznachenie_tip_opisanie_oblast_html": "🧱 <b>{title}</b>\n\nОбозначение: <code>[{code}]</code>\nТип: {type_title}\nОписание: {description}\nОбласть: личная (видна только вам)\nСтатус: {state_label}\nНастройки: {settings_text}\n\nЭто только определение поля. Значение появится, когда кирпичик будет использован в шаблоне анонса; сейчас он не вставляется в посты автоматически."
"bricks.build.proverte_kirpichik_nazvanie_html": "👁 <b>Проверьте кирпичик</b>\n\nНазвание: {title}\nОбозначение: <code>[{code}]</code>\nТип: {type_title}\nОписание: {get}\nОбласть: личная (видна только вам)\nНастройки: {settings_text}\n\nПосле сохранения кирпичик появится в вашем списке. В посты и шаблоны он пока не вставляется."
"bricks.build.proverte_predlozhenie": "Проверьте предложение"
