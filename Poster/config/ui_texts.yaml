# --- Справка (доверенная разметка: ключ заканчивается на _html) ---
# Разметка <b> разрешена: ключ _html. Переменные: {max_photos} —
# лимит фото, {text_limit} — лимит текста, {caption_limit} — лимит подписи.
"help.text_html": "<b>Помощь</b>\n\nЯ собираю анонсы по шаблону: вопросы, живой текст сверху экрана, фотографии и готовый пост в этот чат.\n\n<b>Кнопки меню</b>\n— <b>«📍 Создать для площадки»</b> — список зарегистрированных площадок; тап по названию сразу начинает анонс по её стандартному шаблону. Новую площадку можно добавить там же — анонс откроется сразу после создания;\n— <b>«📝 Создать по личному шаблону»</b> — ваши личные шаблоны. Тап по названию сразу начинает анонс; создание и правка шаблонов — в том же разделе;\n— <b>«📂 Мои анонсы»</b> — незавершённые анонсы можно продолжить, завершённые остаются в истории; новые анонсы их не удаляют;\n— <b>«⚙️ Управление»</b> — площадки, шаблоны и кирпичики. Пункт «🛡 Администрирование» виден только при выданных правах;\n— <b>«❓ Помощь»</b> — эта справка.\n\n<b>Два входа в конструктор</b>\n«Создать для площадки» подставляет площадку и её стандартный шаблон, готовый пост приходит с адресом места. «Создать по личному шаблону» работает без площадки — адрес и контакты берутся из вашего шаблона. Оба входа ведут в один и тот же конструктор.\n\n<b>Фотографии</b>\nМожно отправить одно фото, несколько сразу или альбомом — бот соберёт партию и добавит её к анонсу. Лимит — {max_photos} фото на анонс; 11-е не примется, и экран покажет, что сообщение осталось.\n\n<b>Текст и лимиты</b>\nБез фотографий готовый анонс может занимать до {text_limit} символов, с фотографиями подпись — до {caption_limit}. Слишком длинный анонс не режется молча и не отправляется частями: бот покажет, что именно сократить, и предложит правку.\n\n<b>Ввод и очистка</b>\nВаши сообщения с ответами и фото удаляются после того, как данные надёжно сохранены. Ошибочный ввод остаётся на экране, пока вы не исправите поле. Навигация по кнопкам не плодит сообщения: экран перерисовывается.\n\n<b>Готовый анонс</b>\nПосле отправки анонс можно открыть в «📂 Мои анонсы», изменить поля, фото или дополнительные кирпичики и применить изменения — придёт новая версия. Частичная отправка не дублирует уже доставленные сообщения.\n\n<b>Команды</b>\n/start — главное меню\n/new_wizard — новый анонс\n/places — площадки\n/templates — личные шаблоны\n/bricks — мои кирпичики\n/admin — кабинет, если у вас есть права администратора\n/drafts — мои анонсы (то же, что кнопка «📂 Мои анонсы»)\n/cancel — закрыть текущий диалог без удаления черновика\n/help — эта справка"

