# Тексты интерфейса Poster — единый файл для правки владельцем.
#
# Как пользоваться: см. Poster/docs/ui_texts.md. Коротко:
#   1. правьте только значения после двоеточия, ключи не переименовывайте;
#   2. проверка: .venv/bin/python -m utils.ui_texts (из каталога Poster);
#   3. применение: systemctl --user restart poster-bot.
#
# Правила формата:
# - значение — строка в двойных кавычках в одну строку; перенос строки
#   внутри значения записывается как \n (два символа), например
#   "первая строка\n\nвторая строка";
# - {имя} — переменная, которую подставляет код; набор переменных в строке
#   менять нельзя (проверка сравнит его с вшитым дефолтом);
# - пользовательские значения при подстановке экранируются: < > & " '
#   останутся текстом и не станут разметкой;
# - Telegram-разметка (<b>, <code>) допустима ТОЛЬКО в ключах с суффиксом
#   _html. В остальных строках теги будут показаны как текст;
# - при синтаксической ошибке бот не останется с половиной каталога: он
#   прочитает вшитые дефолты и напишет CRITICAL в лог.

# --- Главное меню и подсказки вне диалога ---
# Первый экран /start. Перенос строки обязателен: текст и подсказка.
