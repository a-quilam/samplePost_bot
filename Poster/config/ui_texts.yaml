"bricks.build.nazvanie_kirpichika_html": "✏️ <b>Название кирпичика</b>\n\n"
"bricks.build.nazvanie_oboznachenie_tip_opisanie_html": "\n\nНазвание: <b>{title}</b>\nОбозначение: <code>[{code}]</code>\nТип: {type_title}\nОписание: {description}\nНастройки: {settings_text}\nЦель: {target}\n\n{availability_text}\n\nПосле отправки будет сохранён неизменяемый снимок. Последующие правки или архивация личного кирпичика не изменят ожидающее предложение. Исходный кирпичик не копируется и не перепривязывается."
"bricks.build.vvedite_novoe_chelovekochitaemoe": "\n\nВведите новое человекочитаемое название — то, что человек видит в списках и на экране вопроса. Оно может повторять названия других кирпичиков: однозначность обеспечивает техническое обозначение."
