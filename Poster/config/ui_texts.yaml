"admin.transfer_invite_confirm.poluchatel_poka_izvesten_botu": "🔗 Poster пока не знает получателя\n\n📍 {canonical_name}\nИмя пользователя: @{username}\n\nИмя пользователя можно сменить, а освободившееся имя может занять другой человек. Поэтому по одному @username нельзя надёжно определить получателя и передать ему права.\n\nБот создаст одноразовую ссылку на 24 часа. Когда получатель её откроет, вы увидите его постоянный ID Telegram. Проверьте, что это нужный человек, и утвердите его. Только после этого он сможет принять передачу прав.\n\nДо подтверждения получателем права остаются у вас."
"admin.transfer_known_confirm.podtverdite_sozdanie_predlozheniy": "📨 Создать предложение передачи прав?\n\n📍 {canonical_name}\nОт: {user_label}\nПолучатель: {transfer_user_label}\n\nPoster уже знает получателя. Предложение будет связано с его постоянным ID Telegram, поэтому смена имени пользователя на него не повлияет.\n\nПолучатель должен подтвердить передачу в течение 24 часов. До подтверждения вы остаётесь администратором."
"admin.transfer_offer.vam_predlagayut_administrirovanie": "📨 Вам предлагают стать администратором места\n\n📍 {place_name}\nОт: {transfer_user_label}\nДействует до: {transfer_expiry_label}\n\nПосле вашего подтверждения права администратора перейдут от отправителя к вам. До этого права остаются у отправителя. Подтвердить передачу можно только из вашего аккаунта Telegram."
"admin.transfer_outgoing.peredacha_administracii_status": "📨 Передача прав администратора\n\n📍 {canonical_name}\nСтатус: {transfer_status_label}\nДействует до: {transfer_expiry_label}\nОтправитель: {transfer_user_label}\n"
"admin.transfer_username.peredacha_administracii_mesta": "🔁 Передать права администратора\n\n📍 {canonical_name}\nОтправитель: {initiator}\n\nПрава перейдут к получателю, когда он подтвердит предложение в своём аккаунте. До этого вы остаётесь администратором и можете отменить передачу.\n\nВведите @username получателя. Если он уже пользовался Poster, выберите его по постоянному ID Telegram. Если бот его пока не знает, появится одноразовая ссылка-приглашение."
