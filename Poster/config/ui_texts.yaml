"menu.outside.photo": "Фото добавляются в анонсе на шаге «Фотографии». Начните анонс кнопкой «📍 Создать для площадки» или «📝 Создать по личному шаблону»."
"menu.outside.text": "Воспользуйтесь кнопками меню или наберите /help — список команд."
"menu.cancel.place": "Сценарий выбора места отменён."
"menu.cancel.admin": "Административный сценарий отменён."
"menu.cancel.brick": "Создание или изменение кирпичика отменено. Данные не изменены."
