# --- Справка (доверенная разметка: ключ заканчивается на _html) ---
# Разметка <b> разрешена: ключ _html. Переменные: {max_photos} —
# лимит фото, {text_limit} — лимит текста, {caption_limit} — лимит подписи.
"help.text_html": "<b>Помощь</b>\n\nPoster помогает собрать анонс по шаблону. Ответьте на вопросы, добавьте фото — и готовый анонс придёт в этот чат. Пока вы отвечаете, текст анонса виден вверху экрана.\n\n<b>Кнопки меню</b>\n— <b>«📍 Создать для площадки»</b> — выберите площадку, чтобы начать анонс по её стандартному шаблону. Новую площадку можно добавить здесь же: после этого сразу откроется анонс.\n— <b>«📝 Создать по личному шаблону»</b> — выберите свой шаблон, чтобы начать анонс. Здесь же можно создавать и менять личные шаблоны.\n— <b>«📂 Мои анонсы»</b> — продолжайте черновики и открывайте готовые анонсы. Новые анонсы не удаляют старые.\n— <b>«⚙️ Управление»</b> — площадки, шаблоны и кирпичики. Раздел «🛡 Администрирование» доступен при наличии прав.\n— <b>«❓ Помощь»</b> — эта справка.\n\n<b>Как выбрать шаблон</b>\nАнонс для площадки использует её стандартный шаблон и адрес из справочника. Анонс по личному шаблону создаётся без площадки: адрес и контакты нужно указать в самом шаблоне. Дальше шаги одинаковые.\n\n<b>Фотографии</b>\nОтправляйте фото по одному, несколько сразу или альбомом. Всего можно добавить до {max_photos} фото. Если лимит исчерпан, новые фото не добавятся, а сообщения с ними останутся в чате.\n\n<b>Длина текста</b>\nБез фото в анонсе может быть до {text_limit} символов. С фото текст отправляется подписью: до {caption_limit} символов. Если текст длиннее, бот покажет, что можно сократить. Обрезать его или отправлять частями он не будет.\n\n<b>Ваши сообщения</b>\nСообщения с ответами и фото удаляются только после сохранения данных. Сообщение с ошибкой остаётся, пока вы не исправите ответ. При переходе по кнопкам обновляется текущий экран.\n\n<b>Готовый анонс</b>\nОткройте анонс в «📂 Мои анонсы», чтобы изменить поля, фото или дополнительные кирпичики и получить новую версию в чате. Если отправка прервётся, уже доставленные сообщения не будут отправлены повторно.\n\n<b>Команды</b>\n/start — главное меню\n/new_wizard — новый анонс\n/places — площадки\n/templates — личные шаблоны\n/bricks — мои кирпичики\n/admin — раздел администрирования, если у вас есть права\n/drafts — мои анонсы, как кнопка «📂 Мои анонсы»\n/cancel — закрыть текущий диалог и оставить черновик\n/help — эта справка"

