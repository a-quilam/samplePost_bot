"admin.transfer_invite_confirm.poluchatel_poka_izvesten_botu": "🔗 Получатель пока не известен боту\n\n📍 {canonical_name}\nUsername: @{username}\n\nПо одному username нельзя достоверно определить Telegram user ID: username можно сменить, а освободившийся — занять другому человеку. Автоматической передачи по username не будет.\n\nБот создаст одноразовую ссылку-приглашение на 24 часа. Открывший её пользователь станет лишь кандидатом: вы увидите его постоянный Telegram user ID и должны будете явно утвердить его. Только после этого получатель сможет подтвердить передачу.\n\nПрава до подтверждения получателя остаются у вас."
"admin.transfer_known_confirm.podtverdite_sozdanie_predlozheniy": "📨 Подтвердите создание предложения\n\n📍 {canonical_name}\nОт: {user_label}\nПолучатель: {transfer_user_label}\n\nПолучатель уже известен боту, поэтому предложение будет привязано к его постоянному Telegram user ID, а не к username. Права перейдут только после его подтверждения; до этого вы остаётесь администратором. Предложение действует 24 часа."
"admin.transfer_offer.vam_predlagayut_administrirovanie": "📨 Вам предлагают администрирование места\n\n📍 {place_name}\nОт: {transfer_user_label}\nДействует до: {transfer_expiry_label}\n\nЕсли вы подтвердите, вы станете администратором этого места, а отправитель потеряет полномочия. До подтверждения права остаются у отправителя. Подтверждение действует только в вашем аккаунте Telegram."
"admin.transfer_outgoing.peredacha_administracii_status": "📨 Передача администрации\n\n📍 {canonical_name}\nСтатус: {transfer_status_label}\nДействует до: {transfer_expiry_label}\nИнициатор: {transfer_user_label}\n"
"admin.transfer_username.peredacha_administracii_mesta": "🔁 Передача администрации места\n\n📍 {canonical_name}\nИнициатор: {initiator}\n\nПередача лишит вас полномочий на это место только после того, как получатель подтвердит предложение в своём аккаунте. До этого вы остаётесь администратором и можете отменить передачу.\n\nВведите @username получателя. Username — только подсказка: если человек уже известен боту, вы выберете его по постоянному Telegram user ID. Если нет — бот создаст одноразовую ссылку-приглашение."
